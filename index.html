<style>
/* Layout: app a una colonna per smartphone, barra in basso con 5 sezioni (Oggi, Settimana, Mese, Cerca, Tabella).
   Colori: palette azzurro/grigio del file Excel; i turni mantengono i colori per fascia (mattina, seminotte, verdone, bussolotto, notturna). */
:root{
  --bg:#f3f6f8; --surface:#ffffff; --ink:#1b2b3a; --muted:#5b6b7d; --line:#d7e1ea;
  --brand:#426b8e; --brand-ink:#294b69; --brand-soft:#dceaf3; --hol:#c00000; --now:#ffc000;
  --f-mattina:#ffe699; --f-seminotte:#bdd7ee; --f-verdone:#c6e0b4; --f-bussolotto:#f8cbad; --f-notturna:#b4a7d6;
  --f-riposo:#d0cece; --f-altro:#eceff2; --f-assenza:#cfe9e6; --f-ink:#1f2a37;
  --display:'Barlow Semi Condensed',system-ui,-apple-system,'Segoe UI',sans-serif;
  --body:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1620; --surface:#16212c; --ink:#e6edf3; --muted:#9aabbb; --line:#2a3947;
  --brand:#7fb0d8; --brand-ink:#a9cdea; --brand-soft:#1c3043; --hol:#ff8f8f; --now:#ffb000;
  --f-mattina:#75661f; --f-seminotte:#2e4d70; --f-verdone:#3b5c34; --f-bussolotto:#7a4833; --f-notturna:#4f4579;
  --f-riposo:#43474c; --f-altro:#262e37; --f-assenza:#22524e; --f-ink:#f1f5f9; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1620; --surface:#16212c; --ink:#e6edf3; --muted:#9aabbb; --line:#2a3947;
  --brand:#7fb0d8; --brand-ink:#a9cdea; --brand-soft:#1c3043; --hol:#ff8f8f; --now:#ffb000;
  --f-mattina:#75661f; --f-seminotte:#2e4d70; --f-verdone:#3b5c34; --f-bussolotto:#7a4833; --f-notturna:#4f4579;
  --f-riposo:#43474c; --f-altro:#262e37; --f-assenza:#22524e; --f-ink:#f1f5f9; color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 96px;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--brand)}
.wrap{max-width:560px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--now);outline-offset:2px}
/* intestazione */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;margin:0 calc(-1 * max(16px,env(safe-area-inset-right,0px))) 0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));
  padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));background:var(--brand);color:#fff}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font:700 20px/1.1 var(--display);letter-spacing:.02em;text-transform:uppercase;min-width:0}
.brand small{display:block;font:500 12px/1.2 var(--body);letter-spacing:.04em;text-transform:none;opacity:.85}
.hd-r{display:flex;align-items:center;gap:8px;flex:0 1 auto;min-width:0;max-width:60%}
.top .brand{flex:1 1 0;min-width:0}
.me{flex:0 1 auto}
.tool{flex:none;width:40px;height:40px;border-radius:999px;border:1px solid rgba(255,255,255,.55);background:rgba(255,255,255,.12);color:#fff;display:grid;place-items:center;padding:0}
.me{min-width:0;display:flex;align-items:center;gap:8px;border:1px solid rgba(255,255,255,.55);background:rgba(255,255,255,.12);color:#fff;
  border-radius:999px;padding:6px 12px;font-weight:700;font-size:14px;min-height:40px}
.me .mm{font-size:inherit}
@media (max-width:430px){.me .mm{display:none}}
.me span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me svg{flex:none}
main{padding-top:16px}
h2{font:700 13px/1.2 var(--display);letter-spacing:.09em;text-transform:uppercase;color:var(--brand-ink);margin:22px 0 8px}
h2:first-child{margin-top:4px}
/* navigazione periodo */
.nav{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.nav .lbl{flex:1;text-align:center;font:700 19px/1.2 var(--display);letter-spacing:.01em;min-width:0}
.nav .lbl small{display:block;font:400 13px var(--body);color:var(--muted);letter-spacing:0}
.btn{min-width:46px;min-height:46px;border:1px solid var(--line);background:var(--surface);border-radius:12px;font-weight:700;display:grid;place-items:center;padding:0 12px}
.btn.today{font-size:13px;min-width:64px}
/* fasce */
.f-mattina{background:var(--f-mattina)} .f-seminotte{background:var(--f-seminotte)} .f-verdone{background:var(--f-verdone)}
.f-bussolotto{background:var(--f-bussolotto)} .f-notturna{background:var(--f-notturna)} .f-riposo{background:var(--f-riposo)} .f-altro{background:var(--f-altro)} .f-assenza{background:var(--f-assenza)}
.f-mattina,.f-seminotte,.f-verdone,.f-bussolotto,.f-notturna,.f-riposo,.f-altro,.f-assenza{color:var(--f-ink)}
/* righe giorno */
.rows{display:grid;gap:8px}
.row{display:grid;grid-template-columns:54px 1fr auto;align-items:center;gap:12px;border-radius:14px;padding:10px 14px;min-height:68px;border:2px solid transparent}
.row.is-today{border-color:var(--now);box-shadow:0 0 0 2px var(--now) inset}
.dd{display:grid;justify-items:center;line-height:1}
.dd span{font:600 12px var(--display);letter-spacing:.08em;text-transform:uppercase;opacity:.8}
.dd b{font:700 30px/1 var(--display)}
.row .t{font:700 20px/1.15 var(--display);letter-spacing:.01em}
.row .s{font-size:14px;opacity:.85}
.tag{font:700 11px var(--display);letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--surface);color:var(--hol);border:1px solid var(--hol)}
/* scheda principale */
.hero{border-radius:20px;padding:18px;display:grid;gap:6px}
.hero .k{font:700 12px var(--display);letter-spacing:.1em;text-transform:uppercase;opacity:.8}
.hero .big{font:700 40px/1.05 var(--display);letter-spacing:.01em}
.hero .time{font:600 24px/1.1 var(--display)}
.hero .st{font-size:15px;margin-top:4px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.muted{color:var(--muted);font-size:14px}
.empty{padding:28px 8px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font:700 20px var(--display);margin-bottom:6px}
.cta{margin-top:14px;background:var(--brand);color:#fff;border:0;border-radius:12px;min-height:48px;padding:0 20px;font-weight:700}
/* mese */
.dow,.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.dow{margin-bottom:3px}
.dow span{text-align:center;font:700 12px var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.cell{border:2px solid transparent;border-radius:9px;padding:3px 2px 5px;min-height:62px;display:grid;align-content:start;justify-items:center;gap:1px;text-align:center;line-height:1.1}
.cell .n{font:700 13px var(--display);align-self:start;justify-self:start;padding-left:3px}
.cell .c{font:700 12px var(--display);letter-spacing:.01em}
.cell .h{font:500 12px var(--display)}
.cell.out{opacity:.42}
.cell.hol .n{color:var(--hol)}
.cell.is-today{border-color:var(--now)}
.cell.sel{outline:3px solid var(--brand-ink);outline-offset:-1px}
.detail{margin-top:10px;border-radius:14px;padding:12px 14px;min-height:64px}
.detail b{font:700 20px var(--display)}
.sum{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.sum div{display:flex;justify-content:space-between;align-items:baseline;border-radius:10px;padding:8px 12px;font-size:15px}
.sum b{font:700 20px var(--display)}
/* cerca */
select{width:100%;min-height:52px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);padding:0 12px;font:inherit;font-size:17px}
.res{display:grid;gap:6px}
.res .g{font:700 13px var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--brand-ink);margin-top:10px}
.res .r{display:flex;justify-content:space-between;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;min-height:48px}
.res .r.mine{background:var(--brand-soft);border-color:var(--brand)}
.res .r b{font-weight:700}
.res .r span{color:var(--muted);font-size:14px;white-space:nowrap}
/* tabella */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface);-webkit-overflow-scrolling:touch}
table{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%}
th,td{padding:0;border-bottom:1px solid var(--line);border-right:1px solid var(--line);text-align:center}
th{position:sticky;top:0;background:var(--brand);color:#fff;font:700 13px/1.15 var(--display);letter-spacing:.04em;padding:8px 4px;z-index:2}
th small{display:block;font:500 12px var(--display)}
th.hol{background:#8d2b2b}
td.who,th.who{position:sticky;left:0;z-index:3;text-align:left;min-width:104px;max-width:104px;padding:6px 8px;background:var(--surface)}
th.who{background:var(--brand);z-index:4}
td.who b{display:block;font:700 14px/1.1 var(--display)}
td.who small{color:var(--muted);font-size:12px}
td.s{min-width:62px;padding:5px 2px;font-size:12px;line-height:1.15}
td.s b{display:block;font:700 13px var(--display)}
td.s i{font:500 12px var(--display);font-style:normal}
tr.me td.who{background:var(--now);color:#1f2a37}
tr.me td.who small{color:#1f2a37}
tr.me td.s{box-shadow:inset 0 2px 0 var(--ink),inset 0 -2px 0 var(--ink)}
tr.off td.s{opacity:.35}
input[type=search]{width:100%;min-height:48px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);padding:0 14px;font:inherit;font-size:17px;margin-bottom:10px}
tbody tr[hidden]{display:none}
td.who{cursor:pointer}
.foot{text-align:center;margin-top:26px}
/* barra in basso */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabs .wrap{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.tab{border:0;background:none;display:grid;justify-items:center;gap:2px;padding:6px 0 4px;border-radius:12px;color:var(--muted);font:600 12px var(--display);letter-spacing:.05em;text-transform:uppercase;min-height:54px}
.tab svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--brand-ink);background:var(--brand-soft)}
/* scelta persona */
.sheet[hidden]{display:none}
.sheet{position:fixed;inset:0;z-index:40;background:rgba(10,18,28,.55);display:grid;align-items:end}
.sheet .p{background:var(--surface);border-radius:20px 20px 0 0;max-height:82vh;max-height:82dvh;display:flex;flex-direction:column;max-width:560px;width:100%;margin:0 auto;
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet h3{margin:0 0 4px;font:700 22px var(--display)}
.sheet p{margin:0 0 10px;color:var(--muted);font-size:14px}
.sheet .l{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;display:grid;gap:6px;align-content:start}
.sheet .l button{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:12px;min-height:50px;padding:0 14px}
.sheet .l button[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft);font-weight:700}
.sheet .l span{color:var(--muted);font-size:14px}
.tag.cb{color:var(--brand-ink);border-color:var(--brand-ink)}
.row[data-act]{cursor:pointer}
.cell{position:relative}
.cell.cb::after{content:"";position:absolute;top:4px;right:4px;width:8px;height:8px;border-radius:50%;background:var(--brand-ink);box-shadow:0 0 0 2px var(--surface)}
td.s.cb{box-shadow:inset 0 0 0 2px var(--brand-ink)}
.ed{display:grid;gap:10px;overflow-y:auto}
.ed input[type=text]{width:100%;min-height:52px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);padding:0 14px;font:inherit;font-size:17px;text-transform:uppercase}
.ed .act{display:flex;gap:8px;flex-wrap:wrap}
.ed .act button{flex:1 1 auto;min-height:48px;border-radius:12px;font-weight:700;padding:0 16px;border:1px solid var(--line);background:var(--bg)}
.ed .act .ok{background:var(--brand);border-color:var(--brand);color:#fff}
.ed .act .rm{color:var(--hol);border-color:var(--hol);background:var(--surface)}
.ed .orig{border-radius:12px;padding:10px 14px}
.cbl .r>div{min-width:0}
.cbl .r span{white-space:normal}
.cbl .r button{flex:none;border:1px solid var(--line);background:var(--bg);border-radius:10px;min-height:40px;padding:0 12px;font-weight:700;font-size:14px}
.ed h2{margin:10px 0 0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:var(--bg);border-radius:999px;min-height:40px;padding:0 14px;font-weight:700;font-size:14px}
.chips button[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft)}
.ck{display:flex;gap:10px;align-items:center;min-height:44px;font-size:15px}
.ck input{width:22px;height:22px;accent-color:var(--brand)}
.ed textarea{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);padding:10px 12px;font:14px/1.3 ui-monospace,monospace;resize:vertical}
.ed .act .fbtn{flex:1 1 auto;min-height:48px;border-radius:12px;font-weight:700;padding:0 16px;border:1px solid var(--line);background:var(--bg);display:grid;place-items:center;cursor:pointer}
.tlst{margin:0;font-weight:700;color:var(--brand-ink);min-height:1.4em}
@media (prefers-reduced-motion:no-preference){.row,.hero,.card{animation:in .18s ease-out}@keyframes in{from{opacity:.4;transform:translateY(4px)}}}
</style>

  return `<div class="nav"><button class="btn" data-act="mp" aria-label="Mese precedente">‹</button><div class="lbl">${MONL[f.getMonth()]} ${f.getFullYear()}</div>
   <button class="btn" data-act="mn" aria-label="Mese successivo">›</button>${curM?'':'<button class="btn today" data-act="mt">Oggi</button>'}</div>
   <div class="dow">${DAY.map(x=>`<span>${x.slice(0,3)}</span>`).join('')}</div><div class="mgrid">${cells}</div>${det}${sum}${me?'':needMe()}`}
function shiftList(){const set=new Map();
  D.grid.forEach(r=>r.forEach(c=>c.forEach(raw=>{if(!raw)return;const k=canon(raw);if(!set.has(k)){const s=mk(new Date(2026,0,5),0,raw);set.set(k,s)}})));
  return [...set.values()].sort((a,b)=>(a.kind==='t'?0:1)-(b.kind==='t'?0:1)||(a.code<b.code?-1:a.code>b.code?1:0)||((a.sm||0)-(b.sm||0)))}
function vCerca(){
  const opts=shiftList().map(s=>`<option value="${s.canon}"${q===s.canon?' selected':''}>${s.kind==='t'?`${s.code} - ${s.hm} (${FNAME[s.fascia]})`:s.code}</option>`).join('');
  let out=`<label for="q" class="muted">Turno da cercare</label><select id="q"><option value="">Scegli un turno…</option>${opts}</select>`;
  if(!q)return out+`<div class="empty">Scegli un turno dal menù per vedere chi lo fa e quando lo fa l'agente scelto.</div>`;
  const e=add(wk,6);let g='',n=0;
  for(let k=0;k<7;k++){const d=add(wk,k);let items='';
    for(let L=1;L<=24;L++){const p=personAt(L,d);if(!p.m)continue;if(canon(rawAt(L,d))!==q)continue;n++;
      items+=`<div class="r${p.m===me?' mine':''}"><b>${p.n}</b><span>${p.m} · Riga ${L}</span></div>`}
    if(items)g+=`<div class="g">${fmtD(d)}</div>${items}`}
  out+=`<h2>Questa settimana (${wk.getDate()} ${MON[wk.getMonth()]} – ${e.getDate()} ${MON[e.getMonth()]}) · ${n}</h2><div class="nav" style="margin-bottom:6px"><button class="btn" data-act="wp" aria-label="Settimana precedente">‹</button><div class="lbl"></div><button class="btn" data-act="wn" aria-label="Settimana successiva">›</button></div><div class="res">${g||'<div class="empty">Nessuno ha questo turno nella settimana.</div>'}</div>`;
  if(me){let m2='',c2=0;const today=sod(new Date());
    for(let i=0;i<168;i++){const d=add(wk,i);const s=shiftOf(me,d);if(s.canon===q){c2++;const w=Math.floor(i/7);
      m2+=`<div class="r"><b>${fmtD(d)}</b><span>Riga ${s.line}${w?' · +'+w+' sett.':''}</span></div>`}}
    out+=`<h2>Quando lo fa ${BASE.find(a=>a.m===me).n} (24 settimane) · ${c2}</h2><div class="res">${m2||'<div class="empty">Non ha questo turno nel prossimo giro.</div>'}</div>`}
  return out}
function vTab(){
  const today=sod(new Date()).getTime();let h='<tr><th class="who">Agente</th>';
  for(let k=0;k<7;k++){const d=add(wk,k);const hn=holName(d);h+=`<th class="${hn?'hol':''}">${DAY[k]}<small>${d.getDate()} ${MON[d.getMonth()]}</small></th>`}
  h+='</tr>';let body='';
  for(let L=1;L<=24;L++){const p=personAt(L,wk);if(!p.m)continue;
    let r=`<tr class="${p.m===me?'me':''}" data-n="${(p.n+' '+p.m).toLowerCase()}"${flt&&!(p.n+' '+p.m).toLowerCase().includes(flt)?' hidden':''}><td class="who" data-act="who" data-m="${p.m}"><b>${p.n}</b><small>Riga ${L}</small></td>`;
    for(let k=0;k<7;k++){const d=add(wk,k);const s=mk(d,L,rawAt(L,d)),c=p.m&&ovr(p.m,d)!=null;
      r+=`<td class="s f-${s.fascia}${c?' cb':''}"><b>${s.kind==='t'?s.code:s.code==='RIPOSO'?'Riposo':s.code}</b>${s.kind==='t'?`<i>${s.hm}</i>`:''}</td>`}
    body+=r+'</tr>'}
  return weekNav()+`<input id="flt" type="search" placeholder="Filtra per agente (nome o matricola)" autocomplete="off" value="${flt}"><div class="tw"><table><thead>${h}</thead><tbody>${body}</tbody></table></div><p class="muted" style="margin-top:10px">Scorri a destra per vedere tutti i giorni. Tocca un nome per vedere solo i turni di quell'agente; l'agente scelto è in giallo.</p>`}

/* ---- disegno ---- */
function render(){
  route();
  $('#tabs').innerHTML=TABS.map(([id,l,p])=>`<button class="tab" data-act="tab" data-t="${id}"${id===tab?' aria-current="page"':''}><svg viewBox="0 0 24 24" aria-hidden="true">${p}</svg>${l}</button>`).join('');
  const m=BASE.find(a=>a.m===me);
  $('#me').innerHTML=m?`<span>${m.n}<small class="mm"> · ${m.m}</small></span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M6 9l6 6 6-6"/></svg>`:`<span>Scegli l'agente</span>`;
  $('#view').innerHTML=({oggi:vOggi,settimana:vSett,mese:vMese,cerca:vCerca,tabella:vTab})[tab]()+`<p class="muted foot">Dati aggiornati il ${D.updated}</p>`;
}
function openSheet(){
  const l=BASE.filter(a=>a.m).slice().sort((a,b)=>a.n<b.n?-1:1);
  $('#list').innerHTML=l.map(a=>`<button data-act="set" data-m="${a.m}" aria-pressed="${a.m===me}">${a.n}<span>${a.m}</span></button>`).join('');
  $('#sheet').hidden=false;}
let edK=null;
function openEd(k){if(!me)return;edK=k;const d=kd(k),s=shiftOf(me,d),o=s.cb?s.orig:s;
  const list=shiftList(),known=list.some(x=>x.canon===s.canon);
  const opts=list.map(x=>`<option value="${x.canon}"${x.canon===s.canon?' selected':''}>${x.kind==='t'?`${x.code} - ${x.hm} (${FNAME[x.fascia]})`:x.code}</option>`).join('');
  $('#ed').innerHTML=`<div><h3 id="ed-t">Cambio turno</h3><p>${fmtDL(d)} · ${BASE.find(a=>a.m===me).n}. Salvato solo su questo telefono.</p></div>
   <div class="orig f-${o.fascia}"><span class="muted" style="color:inherit;opacity:.8">Turno da tabella</span><br><b>${titleOf(o)}</b></div>
   <span class="muted">Assenza rapida</span>
   <div class="chips">${ASS.map(v=>`<button data-act="chip" data-v="${v}" aria-pressed="${s.cb&&s.canon===v}">${v.charAt(0)+v.slice(1).toLowerCase()}</button>`).join('')}</div>
   <label for="ed-s" class="muted">Turno che farai</label>
   <select id="ed-s">${opts}<option value="__x"${known?'':' selected'}>Altro (scrivi a mano)…</option></select>
   <input type="text" id="ed-x" placeholder="Es. FERIE oppure B12-05:10" autocomplete="off" value="${known?'':(s.canon||'')}"${known?' hidden':''}>
   <label for="ed-c" class="muted">Oppure scambia con un collega (vale per entrambi)</label>
   <select id="ed-c"><option value="">Nessuno scambio</option>${BASE.filter(a=>a.m&&a.m!==me).sort((a,b)=>a.n<b.n?-1:1).map(a=>`<option value="${a.m}"${s.sw&&SW[me][k]===a.m?' selected':''}>${a.n} — ${short(origOf(a.m,d))}</option>`).join('')}</select>
   <div class="act"><button class="ok" data-act="eds">Salva</button>${s.cb?'<button class="rm" data-act="edr">Ripristina originale</button>':''}<button data-act="edc">Annulla</button></div>`;
  $('#edsh').hidden=false;$('#ed-s').focus()}
function closeEd(){$('#edsh').hidden=true;edK=null}
const ASS=['FERIE','PERMESSO','MALATTIA','RIPOSO'];
function setSel(v){const sel=$('#ed-s');const has=[...sel.options].some(o=>o.value===v);sel.value=has?v:'__x';const x=$('#ed-x');x.hidden=has;if(!has)x.value=v}
function markChips(v){document.querySelectorAll('.chips button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.v===v)))}

/* ---- calendario (.ics) ---- */
const UT=d=>d.getUTCFullYear()+pad(d.getUTCMonth()+1)+pad(d.getUTCDate())+'T'+pad(d.getUTCHours())+pad(d.getUTCMinutes())+'00Z';
const DV=d=>d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate());
const esc=t=>String(t).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');
function fold(l){let o='';while(l.length>60){o+=l.slice(0,60)+'\r\n ';l=l.slice(60)}return o+l}
function buildIcs(months,all,rem){
  const t0=sod(new Date()),end=new Date(t0.getFullYear(),t0.getMonth()+months,t0.getDate()),now=UT(new Date());
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Turni Settore Nord//IT','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:Turni '+esc(nameOf(me)),'X-WR-TIMEZONE:Europe/Rome'];let n=0;
  for(let d=t0;d<end;d=add(d,1)){const s=shiftOf(me,d);if(s.kind==='n'||(s.kind==='a'&&!all))continue;
    const note=[s.kind==='t'?FNAME[s.fascia]:subOf(s),s.line?'Riga '+s.line:'',s.sw?'Scambio con '+s.sw:'',s.cb?'Al posto di '+short(s.orig):''].filter(Boolean).join(' · ');
    L.push('BEGIN:VEVENT','UID:'+me+'-'+key(d)+'@turni-settore-nord','DTSTAMP:'+now);
    if(s.kind==='t')L.push('DTSTART:'+UT(s.start),'DTEND:'+UT(s.end),'SUMMARY:'+esc(s.code+' '+s.hm+'–'+s.end_hm+(s.cb?' (cambio)':'')));
    else L.push('DTSTART;VALUE=DATE:'+DV(d),'DTEND;VALUE=DATE:'+DV(add(d,1)),'SUMMARY:'+esc((s.code==='RIPOSO'?'Riposo':s.code.charAt(0)+s.code.slice(1).toLowerCase())+(s.cb?' (cambio)':'')),'TRANSP:TRANSPARENT');
    L.push('DESCRIPTION:'+esc(note));
    if(s.kind==='t'&&rem!=='0'){const m=rem==='sera'?Math.round((s.start-new Date(d.getFullYear(),d.getMonth(),d.getDate()-1,20,0))/60000):+rem;
      L.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+esc('Turno '+s.code+' alle '+s.hm),'TRIGGER:-PT'+m+'M','END:VALARM')}
    L.push('END:VEVENT');n++}
  L.push('END:VCALENDAR');return{text:L.map(fold).join('\r\n')+'\r\n',n}}
function dl(name,text,type){const u=URL.createObjectURL(new Blob([text],{type}));const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(u);a.remove()},5000)}

/* ---- backup cambi ---- */
const cbCount=()=>Object.values(CB).reduce((t,x)=>t+Object.keys(x).length,0);
const bkCode=()=>'TURNI1:'+btoa(unescape(encodeURIComponent(JSON.stringify({c:CB,s:SW}))));
function bkRead(txt){txt=(txt||'').trim();if(!txt)throw 0;
  const o=txt.startsWith('TURNI1:')?JSON.parse(decodeURIComponent(escape(atob(txt.slice(7).replace(/\s+/g,''))))):JSON.parse(txt);
  if(!o||typeof o!=='object'||!o.c||typeof o.c!=='object')throw 0;let n=0;
  for(const m in o.c){if(!/^\d+$/.test(m))continue;for(const k in o.c[m]){if(!/^\d{4}-\d{2}-\d{2}$/.test(k))continue;(CB[m]=CB[m]||{})[k]=String(o.c[m][k]).slice(0,24);n++}}
  for(const m in (o.s||{})){if(!/^\d+$/.test(m))continue;for(const k in o.s[m]){if(/^\d{4}-\d{2}-\d{2}$/.test(k))(SW[m]=SW[m]||{})[k]=+o.s[m][k]}}
  save();return n}
function prefs(){try{return Object.assign({m:3,a:true,r:'sera'},JSON.parse(localStorage.getItem('turni-ics')||'{}'))}catch(e){return{m:3,a:true,r:'sera'}}}
const tlSt=m=>{const e=$('#tl-st');if(e)e.textContent=m};
function openTools(){if(!me){openSheet();return}const p=prefs(),n=cbCount();
  $('#tl').innerHTML=`<div><h3 id="tl-t">Calendario e backup</h3><p>${nameOf(me)} · ${me}</p></div>
   <h2>Aggiungi al calendario del telefono</h2>
   <label class="muted" for="ic-p">Periodo, a partire da oggi</label>
   <select id="ic-p">${[1,2,3,6,12].map(v=>`<option value="${v}"${+p.m===v?' selected':''}>${v===1?'1 mese':v+' mesi'}</option>`).join('')}</select>
   <label class="ck"><input type="checkbox" id="ic-a"${p.a?' checked':''}> Includi riposi, assenze e giornate intere</label>
   <label class="muted" for="ic-r">Promemoria</label>
   <select id="ic-r">${[['0','Nessuno'],['sera','La sera prima, alle 20:00'],['60','1 ora prima'],['120','2 ore prima']].map(([v,l])=>`<option value="${v}"${p.r===v?' selected':''}>${l}</option>`).join('')}</select>
   <div class="act"><button class="ok" data-act="ics">Scarica i turni per il calendario</button></div>
   <p class="muted">Aprendo il file, il telefono ti chiede di aggiungere i turni. Mettili in un calendario dedicato (per esempio "Turni"): quando vuoi aggiornarli lo svuoti e reimporti, senza doppioni.</p>
   <h2>Backup dei cambi · ${n}</h2>
   <p class="muted">I cambi sono salvati solo in questo browser. Fai un backup per non perderli o per spostarli su un altro telefono.</p>
   <div class="act"><button data-act="bkc">Copia codice</button><button data-act="bkf">Scarica file</button></div>
   <label class="muted" for="bk-t">Ripristina: incolla un codice oppure scegli un file</label>
   <textarea id="bk-t" rows="3" placeholder="TURNI1:…" autocomplete="off" spellcheck="false"></textarea>
   <div class="act"><button class="ok" data-act="bki">Importa codice</button><label class="fbtn">Scegli file<input type="file" id="bk-f" accept=".json,.txt,application/json,text/plain" hidden></label></div>
   <p class="tlst" id="tl-st" role="status"></p>
   <div class="act"><button data-act="tlc">Chiudi</button></div>`;
  $('#tlsh').hidden=false}
function doImport(txt){try{const n=bkRead(txt);tlSt(`Importati ${n} cambi.`);render()}catch(e){tlSt('Codice o file non valido.')}}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');
  if(!t){if(e.target.id==='sheet'){$('#sheet').hidden=true}if(e.target.id==='edsh')closeEd();if(e.target.id==='tlsh')$('#tlsh').hidden=true;return}
  const a=t.dataset.act;
  if(a==='tools'){openTools();return}
  if(a==='tlc'){$('#tlsh').hidden=true;return}
  if(a==='ics'){const p={m:+$('#ic-p').value,a:$('#ic-a').checked,r:$('#ic-r').value};try{localStorage.setItem('turni-ics',JSON.stringify(p))}catch(x){}
    const r=buildIcs(p.m,p.a,p.r);dl(`turni-${nameOf(me).toLowerCase().replace(/[^a-z0-9]+/g,'-')}-${key(new Date())}.ics`,r.text,'text/calendar;charset=utf-8');tlSt(`File pronto: ${r.n} eventi.`);return}
  if(a==='bkc'){const c=bkCode();const ok=()=>tlSt('Codice copiato. Incollalo in una nota o in un messaggio a te stesso.');
    const fb=()=>{const ta=$('#bk-t');ta.value=c;ta.focus();ta.select();tlSt('Copia il codice evidenziato qui sopra.')};
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(c).then(ok,fb);else fb();return}
  if(a==='bkf'){dl(`turni-cambi-${key(new Date())}.json`,JSON.stringify({c:CB,s:SW},null,1),'application/json');tlSt('File di backup scaricato.');return}
  if(a==='bki'){doImport($('#bk-t').value);return}
  if(a==='chip'){setSel(t.dataset.v);markChips(t.dataset.v);$('#ed-c').value='';return}
  if(a==='edit'){openEd(t.dataset.d);return}
  if(a==='edc'){closeEd();return}
  if(a==='edr'){clearSw(me,edK);setOvr(me,edK,null);closeEd();render();return}
  if(a==='eds'){const v=$('#ed-s').value;let raw=v==='__x'?norm($('#ed-x').value).replace(/[^A-Z0-9:\-À-Ú]/g,''):v;
    if(!raw){$('#ed-x').focus();return}
    const d=kd(edK),c=+$('#ed-c').value||0,mine=origOf(me,d);clearSw(me,edK);
    if(c){clearSw(c,edK);const his=origOf(c,d),same=(his.canon||'')===(mine.canon||'');
      setOvr(me,edK,same?null:(his.canon||''));setOvr(c,edK,same?null:(mine.canon||''));
      if(!same){(SW[me]=SW[me]||{})[edK]=c;(SW[c]=SW[c]||{})[edK]=me;save()}}
    else setOvr(me,edK,canon(raw)===mine.canon?null:canon(raw));
    closeEd();render();return}
  if(a==='tab'){location.hash=t.dataset.t;return}
  if(a==='pick'){openSheet();return}
  if(a==='who'){me=+t.dataset.m;try{localStorage.setItem('turni-matr',String(me))}catch(x){}flt='';location.hash='settimana';render();return}
  if(a==='set'){me=+t.dataset.m;try{localStorage.setItem('turni-matr',String(me))}catch(x){}$('#sheet').hidden=true}
  if(a==='wp')wk=add(wk,-7); if(a==='wn')wk=add(wk,7); if(a==='wt')wk=mon(new Date());
  if(a==='mp'){mo=new Date(mo.getFullYear(),mo.getMonth()-1,1);selDay=null}
  if(a==='mn'){mo=new Date(mo.getFullYear(),mo.getMonth()+1,1);selDay=null}
  if(a==='mt'){const n=new Date();mo=new Date(n.getFullYear(),n.getMonth(),1);selDay=null}
  if(a==='day')selDay=t.dataset.d;
  render()});
document.addEventListener('input',e=>{if(e.target.id==='ed-x'){$('#ed-c').value='';markChips(norm(e.target.value))}if(e.target.id==='flt'){flt=e.target.value.trim().toLowerCase();document.querySelectorAll('tbody tr[data-n]').forEach(r=>{r.hidden=!!flt&&!r.dataset.n.includes(flt)})}});
document.addEventListener('change',e=>{if(e.target.id==='q'){q=e.target.value;render()}
  if(e.target.id==='ed-s'){const x=$('#ed-x');x.hidden=e.target.value!=='__x';if(!x.hidden)x.focus();$('#ed-c').value='';markChips(e.target.value)}
  if(e.target.id==='ed-c'&&e.target.value){const os=origOf(+e.target.value,kd(edK));setSel(os.canon||'');markChips('')}
  if(e.target.id==='bk-f'&&e.target.files[0]){const r=new FileReader();r.onload=()=>doImport(String(r.result));r.readAsText(e.target.files[0]);e.target.value=''}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){$('#sheet').hidden=true;$('#tlsh').hidden=true;closeEd()}
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('.row[data-act]')){e.preventDefault();openEd(e.target.dataset.d)}});
window.addEventListener('hashchange',render);
setInterval(()=>{if(tab==='oggi'&&$('#sheet').hidden&&$('#edsh').hidden&&$('#tlsh').hidden)render()},60000);
render();
if(!me)openSheet();
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});

})();
</script>
