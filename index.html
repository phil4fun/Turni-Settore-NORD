.muted{color:var(--muted);font-size:14px}

.cta{margin-top:14px;background:var(--brand);color:#fff;border:0;border-radius:12px;min-height:48px;padding:0 20px;font-weight:700}

function easter(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),
  h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),
  mo=Math.floor((h+l-7*m+114)/31),da=(h+l-7*m+114)%31+1;return new Date(y,mo-1,da)}
const FIX={'1-1':'Capodanno','6-1':'Epifania','25-4':'Liberazione','1-5':'Festa del Lavoro','2-6':'Festa della Repubblica','15-8':'Ferragosto','1-11':'Ognissanti','8-12':'Immacolata','25-12':'Natale','26-12':'Santo Stefano'};
(D.local||[]).forEach(([g,m,n])=>{FIX[g+'-'+m]=n||'Festivo'});
const eCache={};
function holName(d){const k=d.getDate()+'-'+(d.getMonth()+1);if(FIX[k])return FIX[k];
  const y=d.getFullYear();const e=eCache[y]||(eCache[y]=easter(y));
  const p=add(e,1);if(sod(d).getTime()===p.getTime())return "Lunedì dell'Angelo";return ''}

/* ---- turni ---- */
const norm=r=>(r||'').toUpperCase().replace(/\s+/g,'').replace(/\./g,':');
const RX=/^([A-Z0-9]+)-(\d{1,2}):(\d{2})$/;
const canon=r=>{const s=norm(r);const m=RX.exec(s);return m&&!ALL.has(s)?m[1]+'-'+pad(+m[2])+':'+m[3]:s};
function fasciaOf(t){return t>=280&&t<=320?'mattina':t>=660&&t<=750?'seminotte':t===930?'verdone':t>=990&&t<=1060?'bussolotto':t===1380?'notturna':'altro'}
function weeksFromBase(d){return Math.round((mon(d)-B0)/(7*864e5))}
function rawFor(line,d){const [fe,fs]=D.grid[line-1][wkIdx(d)];return holName(d)&&fs?fs:fe}
function lineOf(matr,d){const p=BASE.findIndex(a=>a.m===matr);if(p<0)return 0;return (((p+weeksFromBase(d))%24)+24)%24+1}
function personAt(line,d){return BASE[(((line-1-weeksFromBase(d))%24)+24)%24]}
function mk(d,line,raw){
  const s=norm(raw);d=sod(d);
  if(!s)return{d,line,kind:'n',code:'',fascia:'altro',title:'Nessun turno',sub:''};
  const m=RX.exec(s);
  if(m&&!ALL.has(s)){const sm=+m[2]*60+ +m[3];const start=new Date(d.getFullYear(),d.getMonth(),d.getDate(),+m[2],+m[3]);
    const end=new Date(d.getFullYear(),d.getMonth(),d.getDate(),+m[2],+m[3]+DUR);
    return{d,line,kind:'t',code:m[1],sm,start,end,fascia:fasciaOf(sm),over:(sm+DUR)>=1440,hm:hm(sm),end_hm:hm(sm+DUR),canon:canon(raw)}}
  return{d,line,kind:'a',code:s,fascia:s==='RIPOSO'?'riposo':'altro',canon:s};
}
function shiftOf(matr,d){const l=lineOf(matr,d);return mk(d,l,l?rawFor(l,d):'')}
function titleOf(s){return s.kind==='t'?`${s.code} · ${s.hm}–${s.end_hm}`:s.code||'Nessun turno'}
function subOf(s){if(s.kind==='t')return (FNAME[s.fascia]||'')+(s.over?' · finisce il giorno dopo':'');if(s.kind==='a')return s.code==='RIPOSO'?'giornata di riposo':'giornata intera';return ''}
function dur(ms){const m=Math.round(ms/60000);if(m<60)return m+' min';const h=Math.floor(m/60);if(h<48)return h+' h'+(m%60?' '+(m%60)+' min':'');return Math.round(h/24)+' giorni'}
const fmtD=d=>DAY[wkIdx(d)]+' '+d.getDate()+' '+MON[d.getMonth()];
const fmtDL=d=>DAYL[wkIdx(d)]+' '+d.getDate()+' '+MONL[d.getMonth()];

/* ---- stato ---- */
let me=null;try{const v=localStorage.getItem('turni-matr');if(v&&BASE.some(a=>a.m===+v))me=+v}catch(e){}
const TABS=[['oggi','Oggi','<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'],['settimana','Settimana','<path d="M4 6h16M4 12h16M4 18h16"/>'],
 ['mese','Mese','<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>'],['cerca','Cerca','<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>'],
 ['tabella','Tabella','<rect x="3" y="4" width="18" height="16" rx="1"/><path d="M3 10h18M9 4v16"/>']];
let flt='',tab='oggi',wk=mon(new Date()),mo=new Date(new Date().getFullYear(),new Date().getMonth(),1),selDay=null,q='';
const route=()=>{const h=(location.hash||'').slice(1);tab=TABS.some(t=>t[0]===h)?h:'oggi'};

/* ---- componenti ---- */
function needMe(){return `<div class="empty"><b>Scegli un agente</b>Per vedere i turni serve sapere di chi.<br><button class="cta" data-act="pick">Scegli</button></div>`}
function dayRow(s,today){const h=holName(s.d);
  return `<div class="row f-${s.fascia}${today?' is-today':''}"><div class="dd"><span>${DAY[wkIdx(s.d)]}</span><b>${s.d.getDate()}</b></div>
  <div><div class="t">${titleOf(s)}</div><div class="s">${subOf(s)}${h&&subOf(s)?' · ':''}${h||''}</div></div>${h?'<span class="tag">Festa</span>':'<span></span>'}</div>`}
function weekNav(){const e=add(wk,6);const cur=wk.getTime()===mon(new Date()).getTime();
  const lbl=`${wk.getDate()} ${wk.getMonth()===e.getMonth()?'':MON[wk.getMonth()]+' '}– ${e.getDate()} ${MON[e.getMonth()]}`;
  return `<div class="nav"><button class="btn" data-act="wp" aria-label="Settimana precedente">‹</button>
  <div class="lbl">${lbl}<small>${e.getFullYear()}${me?' · Riga '+lineOf(me,wk):''}</small></div>
  <button class="btn" data-act="wn" aria-label="Settimana successiva">›</button>${cur?'':'<button class="btn today" data-act="wt">Oggi</button>'}</div>`}

/* ---- viste ---- */
function vOggi(){
  if(!me)return needMe();
  const now=new Date(),today=sod(now),list=[];
  for(let i=-1;i<=40;i++)list.push(shiftOf(me,add(today,i)));
  const t0=list[1],cur=list.find(s=>s.kind==='t'&&s.start<=now&&now<s.end);
  let st='';
  if(t0.kind==='t'){st=now<t0.start?`Inizia alle ${t0.hm}, tra ${dur(t0.start-now)}`:now<t0.end?`In corso, finisce alle ${t0.end_hm} (tra ${dur(t0.end-now)})`:'Turno concluso'}
  else if(t0.kind==='a')st=t0.code==='RIPOSO'?'Oggi riposi':'Giornata intera';
  const h=holName(today);
  let out=`<h2>Oggi · ${fmtDL(today)}${h?' · '+h:''}</h2><div class="hero f-${t0.fascia}"><span class="k">${FNAME[t0.fascia]||'Turno'}</span>
   <span class="big">${t0.kind==='t'?t0.code:t0.code||'—'}</span>${t0.kind==='t'?`<span class="time">${t0.hm} – ${t0.end_hm}${t0.over?' (+1)':''}</span>`:''}<span class="st">${st}</span></div>`;
  if(cur&&cur!==t0)out+=`<div class="card" style="margin-top:10px"><b>Ancora in servizio</b><div class="muted">Turno iniziato ieri alle ${cur.hm}, finisce alle ${cur.end_hm} (tra ${dur(cur.end-now)})</div></div>`;
  const nx=list.find(s=>s.kind==='t'&&s.start>now&&s.d>today);
  if(nx)out+=`<h2>Prossimo turno in servizio</h2><div class="row f-${nx.fascia}" style="grid-template-columns:54px 1fr"><div class="dd"><span>${DAY[wkIdx(nx.d)]}</span><b>${nx.d.getDate()}</b></div><div><div class="t">${titleOf(nx)}</div><div class="s">${subOf(nx)} · tra ${dur(nx.start-now)}</div></div></div>`;
  out+=`<h2>Prossimi giorni</h2><div class="rows">`+list.slice(2,6).map(s=>dayRow(s,false)).join('')+`</div>`;
  out+=`<p class="muted" style="margin-top:14px">${BASE.find(a=>a.m===me).n} è in Riga ${lineOf(me,today)} questa settimana.</p>`;return out}
function vSett(){
  if(!me)return weekNav()+needMe();
  const today=sod(new Date()).getTime();let rows='';
  for(let k=0;k<7;k++){const d=add(wk,k);rows+=dayRow(shiftOf(me,d),d.getTime()===today)}
  return weekNav()+`<div class="rows">${rows}</div>`}
function vMese(){
  const f=mo,gs=mon(f),today=sod(new Date()).getTime(),cnt={};let cells='';
  for(let i=0;i<42;i++){const d=add(gs,i),inn=d.getMonth()===f.getMonth(),s=me?shiftOf(me,d):mk(d,0,''),h=holName(d);
    if(inn&&me)cnt[s.fascia]=(cnt[s.fascia]||0)+1;
    const c=s.kind==='t'?`<span class="c">${s.code}</span><span class="h">${s.hm}</span>`:`<span class="c">${s.kind==='a'?(s.code==='RIPOSO'?'Riposo':s.code):''}</span>`;
    cells+=`<button class="cell f-${me?s.fascia:'altro'}${inn?'':' out'}${h?' hol':''}${d.getTime()===today?' is-today':''}${selDay===key(d)?' sel':''}" data-act="day" data-d="${key(d)}" aria-label="${fmtDL(d)}"><span class="n">${d.getDate()}</span>${me?c:''}</button>`}
  let det='';
  if(me){const sd=selDay?selDay.split('-').map(Number):null;const d=sd?new Date(sd[0],sd[1]-1,sd[2]):null;
    if(d){const s=shiftOf(me,d),h=holName(d);det=`<div class="detail f-${s.fascia}"><b>${fmtDL(d)}${h?' · '+h:''}</b><div>${titleOf(s)}${subOf(s)?' · '+subOf(s):''}</div></div>`}
    else det=`<div class="detail card muted">Tocca un giorno per vedere il dettaglio.</div>`}
  const ord=[['riposo','Riposi'],['mattina','Mattine'],['seminotte','Seminotte'],['verdone','Verdone'],['bussolotto','Bussolotto'],['notturna','Notturne'],['altro','Altre giornate']];
  const sum=me?`<h2>Riepilogo del mese</h2><div class="sum">${ord.map(([k,l])=>`<div class="f-${k}"><span>${l}</span><b>${cnt[k]||0}</b></div>`).join('')}</div>`:'';
  const curM=f.getFullYear()===new Date().getFullYear()&&f.getMonth()===new Date().getMonth();
  return `<div class="nav"><button class="btn" data-act="mp" aria-label="Mese precedente">‹</button><div class="lbl">${MONL[f.getMonth()]} ${f.getFullYear()}</div>
   <button class="btn" data-act="mn" aria-label="Mese successivo">›</button>${curM?'':'<button class="btn today" data-act="mt">Oggi</button>'}</div>
   <div class="dow">${DAY.map(x=>`<span>${x.slice(0,3)}</span>`).join('')}</div><div class="mgrid">${cells}</div>${det}${sum}${me?'':needMe()}`}
function shiftList(){const set=new Map();
  D.grid.forEach(r=>r.forEach(c=>c.forEach(raw=>{if(!raw)return;const k=canon(raw);if(!set.has(k)){const s=mk(new Date(2026,0,5),0,raw);set.set(k,s)}})));
  return [...set.values()].sort((a,b)=>(a.kind==='t'?0:1)-(b.kind==='t'?0:1)||(a.code<b.code?-1:a.code>b.code?1:0)||((a.sm||0)-(b.sm||0)))}
function vCerca(){
  const opts=shiftList().map(s=>`<option value="${s.canon}"${q===s.canon?' selected':''}>${s.kind==='t'?`${s.code} - ${s.hm} (${FNAME[s.fascia]})`:s.code}</option>`).join('');
  let out=`<label for="q" class="muted">Turno da cercare</label><select id="q"><option value="">Scegli un turno…</option>${opts}</select>`;
  if(!q)return out+`<div class="empty">Scegli un turno dal menù per vedere chi lo fa e quando lo fa l'agente scelto.</div>`;
  const e=add(wk,6);let g='',n=0;
  for(let k=0;k<7;k++){const d=add(wk,k);let items='';
    for(let L=1;L<=24;L++){const p=personAt(L,d);if(!p.m)continue;if(canon(rawFor(L,d))!==q)continue;n++;
      items+=`<div class="r${p.m===me?' mine':''}"><b>${p.n}</b><span>${p.m} · Riga ${L}</span></div>`}
    if(items)g+=`<div class="g">${fmtD(d)}</div>${items}`}
  out+=`<h2>Questa settimana (${wk.getDate()} ${MON[wk.getMonth()]} – ${e.getDate()} ${MON[e.getMonth()]}) · ${n}</h2><div class="nav" style="margin-bottom:6px"><button class="btn" data-act="wp" aria-label="Settimana precedente">‹</button><div class="lbl"></div><button class="btn" data-act="wn" aria-label="Settimana successiva">›</button></div><div class="res">${g||'<div class="empty">Nessuno ha questo turno nella settimana.</div>'}</div>`;
  if(me){let m2='',c2=0;const today=sod(new Date());
    for(let i=0;i<168;i++){const d=add(wk,i);const s=shiftOf(me,d);if(s.canon===q){c2++;const w=Math.floor(i/7);
      m2+=`<div class="r"><b>${fmtD(d)}</b><span>Riga ${s.line}${w?' · +'+w+' sett.':''}</span></div>`}}
    out+=`<h2>Quando lo fa ${BASE.find(a=>a.m===me).n} (24 settimane) · ${c2}</h2><div class="res">${m2||'<div class="empty">Non ha questo turno nel prossimo giro.</div>'}</div>`}
  return out}
function vTab(){
  const today=sod(new Date()).getTime();let h='<tr><th class="who">Agente</th>';
  for(let k=0;k<7;k++){const d=add(wk,k);const hn=holName(d);h+=`<th class="${hn?'hol':''}">${DAY[k]}<small>${d.getDate()} ${MON[d.getMonth()]}</small></th>`}
  h+='</tr>';let body='';
  for(let L=1;L<=24;L++){const p=personAt(L,wk);if(!p.m)continue;
    let r=`<tr class="${p.m===me?'me':''}" data-n="${(p.n+' '+p.m).toLowerCase()}"${flt&&!(p.n+' '+p.m).toLowerCase().includes(flt)?' hidden':''}><td class="who" data-act="who" data-m="${p.m}"><b>${p.n}</b><small>Riga ${L}</small></td>`;
    for(let k=0;k<7;k++){const d=add(wk,k);const s=mk(d,L,rawFor(L,d));
      r+=`<td class="s f-${s.fascia}"><b>${s.kind==='t'?s.code:s.code==='RIPOSO'?'Riposo':s.code}</b>${s.kind==='t'?`<i>${s.hm}</i>`:''}</td>`}
    body+=r+'</tr>'}
  return weekNav()+`<input id="flt" type="search" placeholder="Filtra per agente (nome o matricola)" autocomplete="off" value="${flt}"><div class="tw"><table><thead>${h}</thead><tbody>${body}</tbody></table></div><p class="muted" style="margin-top:10px">Scorri a destra per vedere tutti i giorni. Tocca un nome per vedere solo i turni di quell'agente; l'agente scelto è in giallo.</p>`}

/* ---- disegno ---- */
function render(){
  route();
  $('#tabs').innerHTML=TABS.map(([id,l,p])=>`<button class="tab" data-act="tab" data-t="${id}"${id===tab?' aria-current="page"':''}><svg viewBox="0 0 24 24" aria-hidden="true">${p}</svg>${l}</button>`).join('');
  const m=BASE.find(a=>a.m===me);
  $('#me').innerHTML=m?`<span>${m.n} · ${m.m}</span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M6 9l6 6 6-6"/></svg>`:`<span>Scegli l'agente</span>`;
  $('#view').innerHTML=({oggi:vOggi,settimana:vSett,mese:vMese,cerca:vCerca,tabella:vTab})[tab]()+`<p class="muted foot">Dati aggiornati il ${D.updated}</p>`;
}
function openSheet(){
  const l=BASE.filter(a=>a.m).slice().sort((a,b)=>a.n<b.n?-1:1);
  $('#list').innerHTML=l.map(a=>`<button data-act="set" data-m="${a.m}" aria-pressed="${a.m===me}">${a.n}<span>${a.m}</span></button>`).join('');
  $('#sheet').hidden=false;}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');
  if(!t){if(e.target.id==='sheet'){$('#sheet').hidden=true}return}
  const a=t.dataset.act;
  if(a==='tab'){location.hash=t.dataset.t;return}
  if(a==='pick'){openSheet();return}
  if(a==='who'){me=+t.dataset.m;try{localStorage.setItem('turni-matr',String(me))}catch(x){}flt='';location.hash='settimana';render();return}
  if(a==='set'){me=+t.dataset.m;try{localStorage.setItem('turni-matr',String(me))}catch(x){}$('#sheet').hidden=true}
  if(a==='wp')wk=add(wk,-7); if(a==='wn')wk=add(wk,7); if(a==='wt')wk=mon(new Date());
  if(a==='mp'){mo=new Date(mo.getFullYear(),mo.getMonth()-1,1);selDay=null}
  if(a==='mn'){mo=new Date(mo.getFullYear(),mo.getMonth()+1,1);selDay=null}
  if(a==='mt'){const n=new Date();mo=new Date(n.getFullYear(),n.getMonth(),1);selDay=null}
  if(a==='day')selDay=t.dataset.d;
  render()});
document.addEventListener('input',e=>{if(e.target.id==='flt'){flt=e.target.value.trim().toLowerCase();document.querySelectorAll('tbody tr[data-n]').forEach(r=>{r.hidden=!!flt&&!r.dataset.n.includes(flt)})}});
document.addEventListener('change',e=>{if(e.target.id==='q'){q=e.target.value;render()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#sheet').hidden=true});
window.addEventListener('hashchange',render);
setInterval(()=>{if(tab==='oggi'&&$('#sheet').hidden)render()},60000);
render();
if(!me)openSheet();

})();
</script>
